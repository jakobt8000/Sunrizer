name: Build Mac plugin

on:
  push:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode

      - name: Build VST3 and AU (universal, Apple Silicon and Intel)
        run: cmake --build build --config Release --target Sunrize_VST3 Sunrize_AU -- -quiet

      - name: Sign (ad-hoc) and package
        run: |
          ART=build/Sunrize_artefacts/Release
          mkdir -p SUNRIZE
          cp -R "$ART/VST3/SUNRIZE.vst3" SUNRIZE/
          cp -R "$ART/AU/SUNRIZE.component" SUNRIZE/
          codesign --force --deep --sign - SUNRIZE/SUNRIZE.vst3
          codesign --force --deep --sign - SUNRIZE/SUNRIZE.component
          lipo -info SUNRIZE/SUNRIZE.vst3/Contents/MacOS/SUNRIZE
          cp INSTALL.txt install.command SUNRIZE/
          chmod +x SUNRIZE/install.command
          ditto -c -k --keepParent SUNRIZE SUNRIZE-mac.zip

      - name: Validate AU with Apple's auval
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R SUNRIZE/SUNRIZE.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -v aumu Srzn Rznz

      - uses: actions/upload-artifact@v4
        with:
          name: SUNRIZE-mac
          path: SUNRIZE-mac.zip
